[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-trading-novel"
version = "0.1.0"
description = "Replication toolkit for pairs trading using graphical matching."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "statsmodels>=0.14",
  "scipy>=1.11"
]

[project.optional-dependencies]
notebooks = ["nbclient>=0.10", "nbformat>=5.9", "jupyter>=1.0"]
bloomberg = ["blpapi>=3.24"]

[tool.setuptools.packages.find]
where = ["src"]
